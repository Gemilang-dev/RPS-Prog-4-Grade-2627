databases:
  - name: rps-db
    databaseName: rps
    user: rpsuser

services:
  - type: web
    name: rps-portal
    env: node
    plan: free
    rootDir: backend
    buildCommand: "npm install"
    startCommand: "npm start"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rps-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
